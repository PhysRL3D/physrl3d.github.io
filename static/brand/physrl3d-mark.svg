<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="mark-title mark-description">
  <title id="mark-title">PhysRL3D — a grounded learning loop</title>
  <desc id="mark-description">A purple three-dimensional block, a black reward-feedback loop, and a centre-of-mass projection onto a support plane.</desc>
  <defs>
    <linearGradient id="cube-top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9b2eb"/><stop offset="1" stop-color="#a17aca"/></linearGradient>
    <linearGradient id="cube-left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b73c7"/><stop offset="1" stop-color="#7950a8"/></linearGradient>
    <linearGradient id="cube-right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7951a9"/><stop offset="1" stop-color="#513378"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#fff"/>
  <g id="reward-feedback" fill="none" stroke="#202024" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.6 43.3A25 25 0 1 1 51.2 45.9"/>
    <path d="M57.3 44.6L50.6 46.4L49.3 39.7"/>
  </g>
  <g id="three-dimensional-shape" stroke-linejoin="round">
    <path d="M32 14L46 22L32 30L18 22Z" fill="url(#cube-top)"/>
    <path d="M18 22L32 30V47L18 39Z" fill="url(#cube-left)"/>
    <path d="M32 30L46 22V39L32 47Z" fill="url(#cube-right)"/>
    <path d="M18.5 22.3L32 30L45.5 22.3" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width=".6"/>
  </g>
  <g id="physical-balance">
    <path d="M32 35V48" stroke="#fff" stroke-width="1.4" stroke-dasharray="2 2"/>
    <path d="M32 49V54" stroke="#202024" stroke-width="1.4" stroke-dasharray="2 2"/>
    <circle cx="32" cy="33.4" r="2.3" fill="#fff"/>
    <path d="M18 55H46" stroke="#202024" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="32" cy="55" r="2.2" fill="#202024"/>
  </g>
</svg>
